<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ONCLICK | Hospital Admin</title>
  <link rel="stylesheet" href="/style.css"/>
  <style>
    body { min-height:100dvh; display:flex; flex-direction:column; }
    .page-wrap { flex:1; padding:calc(var(--nav-h)+18px) 24px 30px; max-width:640px; margin:0 auto; width:100%; display:flex; flex-direction:column; gap:18px; position:relative; z-index:2; }
    .page-header h1 { font-family:var(--font-head); font-size:clamp(1.5rem,5vw,2.2rem); font-weight:800; color:white; line-height:1.1; animation:fade-up 0.45s var(--ease-out) both; }
    .page-header .sub { font-family:var(--font-mono); font-size:0.65rem; color:var(--text-secondary); margin-top:6px; }
    .selector { padding:10px 14px; background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius-md); color:white; font-family:var(--font-mono); font-size:0.72rem; width:100%; }
    .selector option { background:var(--bg-surface); }
    .section-title { font-family:var(--font-mono); font-size:0.6rem; letter-spacing:0.14em; text-transform:uppercase; color:var(--accent); margin-bottom:8px; padding-top:8px; border-top:1px solid rgba(255,255,255,0.04); }
    .cap-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:8px; }
    .cap-item { display:flex; align-items:center; justify-content:space-between; padding:10px 14px; background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius-md); font-family:var(--font-mono); font-size:0.62rem; color:var(--text-secondary); text-transform:uppercase; letter-spacing:0.04em; transition:all var(--trans-fast); }
    .cap-item.active { border-color:rgba(46,213,115,0.3); background:var(--stable-dim); color:var(--stable); }
    .cap-toggle { width:36px; height:20px; background:var(--bg-card-solid); border:1px solid var(--border); border-radius:20px; position:relative; cursor:pointer; transition:all var(--trans-fast); flex-shrink:0; }
    .cap-toggle::after { content:''; position:absolute; top:2px; left:2px; width:14px; height:14px; border-radius:50%; background:var(--text-muted); transition:all var(--trans-fast); }
    .cap-toggle.on { background:rgba(46,213,115,0.2); border-color:rgba(46,213,115,0.4); }
    .cap-toggle.on::after { left:18px; background:var(--stable); }
    .equip-status { display:flex; gap:6px; margin-top:4px; }
    .eq-btn { padding:4px 10px; border-radius:var(--radius-pill); font-family:var(--font-mono); font-size:0.52rem; letter-spacing:0.06em; text-transform:uppercase; cursor:pointer; border:1px solid var(--border); background:var(--bg-card); color:var(--text-secondary); transition:all var(--trans-fast); }
    .eq-btn.sel-avail { border-color:rgba(46,213,115,0.3); background:var(--stable-dim); color:var(--stable); }
    .eq-btn.sel-use { border-color:rgba(255,165,2,0.3); background:var(--urgent-dim); color:var(--urgent); }
    .eq-btn.sel-maint { border-color:rgba(255,71,87,0.3); background:var(--critical-dim); color:var(--critical); }
    .blood-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
    .blood-item { display:flex; flex-direction:column; align-items:center; gap:6px; padding:12px 8px; background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius-md); }
    .blood-type { font-family:var(--font-head); font-size:0.85rem; font-weight:700; color:var(--critical); }
    .blood-controls { display:flex; align-items:center; gap:8px; }
    .blood-btn { width:26px; height:26px; border-radius:50%; border:1px solid var(--border-mid); background:var(--bg-card); color:white; font-size:1rem; display:flex; align-items:center; justify-content:center; cursor:pointer; transition:all var(--trans-fast); }
    .blood-btn:hover { border-color:var(--accent); color:var(--accent); }
    .blood-val { font-family:var(--font-head); font-size:1.1rem; font-weight:700; color:white; min-width:24px; text-align:center; }
    .btn-save { width:100%; padding:16px; background:linear-gradient(135deg,#2ed573,#1e8449); border:none; border-radius:var(--radius-pill); font-family:var(--font-head); font-size:1rem; font-weight:800; letter-spacing:0.06em; text-transform:uppercase; color:white; cursor:pointer; transition:all 0.25s var(--ease-spring); box-shadow:0 6px 24px rgba(46,213,115,0.2); }
    .btn-save:hover { transform:scale(1.03); }
    .btn-save:active { transform:scale(0.97); }
    .toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); padding:12px 24px; background:var(--stable-dim); border:1px solid rgba(46,213,115,0.3); border-radius:var(--radius-pill); font-family:var(--font-mono); font-size:0.68rem; color:var(--stable); z-index:500; display:none; animation:fade-up 0.3s var(--ease-out) both; }
    .toast.show { display:block; }
    .incoming-banner { display:none; background:linear-gradient(135deg,rgba(79,70,229,0.9),rgba(99,140,255,0.9)); padding:12px 20px; text-align:center; font-family:var(--font-head); font-size:0.8rem; font-weight:700; letter-spacing:0.04em; color:white; border-bottom:1px solid rgba(255,255,255,0.2); animation:fade-up 0.3s var(--ease-out) both; }
    .incoming-banner.show { display:block; }
  </style>
</head>
<body class="scanline-overlay">
  <div class="mesh-bg"></div><div class="noise-overlay"></div>
  <div class="hud-corner hud-tl"></div><div class="hud-corner hud-tr"></div><div class="hud-corner hud-bl"></div><div class="hud-corner hud-br"></div>
  <nav class="nav-bar">
    <a class="nav-back" href="/dashboard">← Dashboard</a>
    <div class="nav-logo"><em>ON</em>CLICK <span class="nav-slash">/ HOSPITAL ADMIN</span></div>
    <div class="nav-spacer"></div>
    <div class="nav-badge"><span class="nav-dot"></span>Admin</div>
  </nav>

  <div class="incoming-banner" id="incoming-banner">🚨 INCOMING PATIENT: <span id="inc-details">...</span></div>

  <main class="page-wrap">
    <div class="page-header">
      <h1>🏥 Hospital<br/>Administration</h1>
      <div class="sub">Update facility capabilities, equipment status & blood bank in real time.</div>
    </div>

    <div class="form-group"><div class="form-label" style="font-family:var(--font-mono);font-size:0.6rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--accent);">Select Hospital</div>
      <select class="selector" id="hospital-select"></select>
    </div>

    <div id="admin-panel" style="display:none;">
      <div class="section-title">⚡ Facility Capabilities</div>
      <div class="cap-grid" id="cap-grid"></div>

      <div class="section-title" style="margin-top:16px;">🔧 Equipment Status</div>
      <div id="equip-panel" style="display:flex;flex-direction:column;gap:8px;"></div>

      <div class="section-title" style="margin-top:16px;">🩸 Blood Bank Inventory</div>
      <div class="blood-grid" id="blood-grid"></div>

      <button class="btn-save" style="margin-top:20px;" onclick="saveAll()">💾 Save & Broadcast Updates</button>
    </div>

    <div class="toast" id="toast">✅ Hospital data updated & broadcasted.</div>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    let socket; try { socket=io(); } catch(e){}
    let hospitals=[], currentH=null;
    const capKeys=['cathLab','mri','ct','nicu','burnsUnit','dialysis','traumaCenter'];
    const capLabels={cathLab:'Cath Lab',mri:'MRI',ct:'CT Scan',nicu:'NICU',burnsUnit:'Burns Unit',dialysis:'Dialysis',traumaCenter:'Trauma Center'};
    const bloodTypes=['A+','A-','B+','B-','AB+','AB-','O+','O-'];

    fetch('/api/hospitals').then(r=>r.json()).then(data => {
      hospitals=data;
      const sel=document.getElementById('hospital-select');
      data.forEach(h => { const o=document.createElement('option'); o.value=h.id; o.textContent=h.name; sel.appendChild(o); });
      if(data.length) { sel.value=data[0].id; loadHospital(data[0].id); }
    });

    document.getElementById('hospital-select').addEventListener('change', e => loadHospital(e.target.value));

    function loadHospital(id) {
      currentH=hospitals.find(h=>h.id===id);
      if(!currentH) return;
      document.getElementById('admin-panel').style.display='block';
      renderCaps(); renderEquip(); renderBlood();
    }

    function renderCaps() {
      const grid=document.getElementById('cap-grid');
      grid.innerHTML='';
      capKeys.forEach(key => {
        const val=currentH.capabilities?.[key]||false;
        const item=document.createElement('div');
        item.className='cap-item'+(val?' active':'');
        item.innerHTML=`<span>${capLabels[key]}</span><div class="cap-toggle${val?' on':''}" data-key="${key}" onclick="toggleCap(this,'${key}')"></div>`;
        grid.appendChild(item);
      });
    }

    function toggleCap(el, key) {
      const on=el.classList.toggle('on');
      el.closest('.cap-item').classList.toggle('active',on);
      if(!currentH.capabilities) currentH.capabilities={};
      currentH.capabilities[key]=on;
    }

    function renderEquip() {
      const panel=document.getElementById('equip-panel');
      panel.innerHTML='';
      capKeys.forEach(key => {
        const status=currentH.equipment_status?.[key]||'available';
        const div=document.createElement('div');
        div.className='cap-item'; div.style.flexDirection='column'; div.style.alignItems='flex-start'; div.style.gap='6px';
        div.innerHTML=`<span>${capLabels[key]}</span><div class="equip-status">
          <button class="eq-btn${status==='available'?' sel-avail':''}" onclick="setEquip(this,'${key}','available')">Available</button>
          <button class="eq-btn${status==='in_use'?' sel-use':''}" onclick="setEquip(this,'${key}','in_use')">In Use</button>
          <button class="eq-btn${status==='maintenance'?' sel-maint':''}" onclick="setEquip(this,'${key}','maintenance')">Maintenance</button>
        </div>`;
        panel.appendChild(div);
      });
    }

    function setEquip(btn, key, val) {
      btn.parentElement.querySelectorAll('.eq-btn').forEach(b=>b.className='eq-btn');
      btn.classList.add(val==='available'?'sel-avail':val==='in_use'?'sel-use':'sel-maint');
      if(!currentH.equipment_status) currentH.equipment_status={};
      currentH.equipment_status[key]=val;
    }

    function renderBlood() {
      const grid=document.getElementById('blood-grid');
      grid.innerHTML='';
      bloodTypes.forEach(type => {
        const val=currentH.bloodBank?.[type]||0;
        const div=document.createElement('div');
        div.className='blood-item';
        div.innerHTML=`<div class="blood-type">${type}</div><div class="blood-controls"><button class="blood-btn" onclick="adjBlood('${type}',-1)">−</button><div class="blood-val" id="bv-${type.replace('+','p').replace('-','n')}">${val}</div><button class="blood-btn" onclick="adjBlood('${type}',1)">+</button></div>`;
        grid.appendChild(div);
      });
    }

    function adjBlood(type, delta) {
      if(!currentH.bloodBank) currentH.bloodBank={};
      currentH.bloodBank[type]=Math.max(0,(currentH.bloodBank[type]||0)+delta);
      const id='bv-'+type.replace('+','p').replace('-','n');
      document.getElementById(id).textContent=currentH.bloodBank[type];
    }

    function saveAll() {
      fetch('/api/hospital-admin/update',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({hospitalId:currentH.id,capabilities:currentH.capabilities,equipment_status:currentH.equipment_status,bloodBank:currentH.bloodBank})
      }).then(()=>{
        const t=document.getElementById('toast'); t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),3000);
      });
    }

    // ── Coordination Listeners ─────────────────────────────────
    socket.on('clinical_brief', (data) => {
      if (!currentH) return;
      // Match by name or ID
      if (data.hospital === currentH.name || data.hospitalId === currentH.id) {
        const banner = document.getElementById('incoming-banner');
        const details = document.getElementById('inc-details');
        details.textContent = `${data.brief.injuryType} (${data.brief.triageLevel}) — ETA ${data.brief.etaMins}`;
        banner.classList.add('show');
        setTimeout(() => banner.classList.remove('show'), 60000);
      }
    });

    socket.on('specialist_alert', (data) => {
      if (!currentH) return;
      if (data.hospital === currentH.name || data.hospitalId === currentH.id) {
        const banner = document.getElementById('incoming-banner');
        const details = document.getElementById('inc-details');
        details.innerHTML = `<b style="color:#ec4899">SPECIALIST ALERT:</b> ${data.specialistType} requested for SOS ${data.sosId}`;
        banner.style.background = 'linear-gradient(135deg, rgba(236,72,153,0.9), rgba(124,58,237,0.9))';
        banner.classList.add('show');
        setTimeout(() => {
          banner.classList.remove('show');
          banner.style.background = ''; // reset to default
        }, 30000);
      }
    });

    socket.on('bed_booked_notif', (data) => {
      if (!currentH) return;
      if (data.hospitalId === currentH.id) {
        const banner = document.getElementById('incoming-banner');
        const details = document.getElementById('inc-details');
        details.innerHTML = `<b style="color:#ff4757">BED RESERVED</b> for SOS ${data.incidentId}`;
        banner.classList.add('show');
        // Refresh bed count
        fetch('/api/hospitals').then(r=>r.json()).then(h => hospitals=h);
      }
    });
  </script>
</body>
</html>
