<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>ONCLICK | Help is Coming</title>
  <meta name="description" content="ONCLICK — your SOS has been received. Help is being dispatched to your location."/>
  <link rel="stylesheet" href="/style.css"/>
  <link rel="stylesheet" href="/lib/leaflet/leaflet.css"/>
  <script src="/lib/leaflet/leaflet.js"></script>
  <style>
    body {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: calc(var(--nav-h) + 20px) 24px 30px;
    }

    .confirm-wrap {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      animation: fade-up 0.5s var(--ease-out) both;
    }

    /* ── Radar / Status ── */
    .status-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      padding: 28px 0 10px;
    }
    .status-icon-wrap {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .status-circle {
      width: 96px; height: 96px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1;
      position: relative;
      font-size: 2.6rem;
      line-height: 1;
    }
    .status-circle.waiting {
      background: rgba(99,140,255,0.08);
      border: 2.5px solid rgba(99,140,255,0.45);
      animation: pulse-wait 2s ease-in-out infinite;
    }
    .status-circle.confirmed {
      background: rgba(46,213,115,0.08);
      border: 2.5px solid rgba(46,213,115,0.5);
      animation: pulse-confirmed 2s ease-in-out infinite;
    }
    @keyframes pulse-wait {
      0%   { box-shadow: 0 0 0 0 rgba(99,140,255,0.3); transform: scale(0.97); }
      70%  { box-shadow: 0 0 0 18px rgba(99,140,255,0); transform: scale(1); }
      100% { box-shadow: 0 0 0 0 rgba(99,140,255,0); transform: scale(0.97); }
    }
    @keyframes pulse-confirmed {
      0%   { box-shadow: 0 0 0 0 rgba(46,213,115,0.3); transform: scale(0.97); }
      70%  { box-shadow: 0 0 0 18px rgba(46,213,115,0); transform: scale(1); }
      100% { box-shadow: 0 0 0 0 rgba(46,213,115,0); transform: scale(0.97); }
    }
    .ring-1, .ring-2 {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
    }
    .ring-1 { width: 118px; height: 118px; border: 1px solid rgba(99,140,255,0.12); }
    .ring-2 { width: 146px; height: 146px; border: 1px solid rgba(99,140,255,0.06); }
    .confirmed .ring-1 { border-color: rgba(46,213,115,0.12); }
    .confirmed .ring-2 { border-color: rgba(46,213,115,0.06); }

    .status-title {
      font-family: var(--font-head);
      font-size: 1.5rem;
      font-weight: 700;
      color: white;
      text-align: center;
    }
    .status-subtitle {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-secondary);
      text-align: center;
    }

    /* ETA Display */
    .eta-display {
      font-family: var(--font-head);
      font-size: 2.6rem;
      font-weight: 800;
      color: var(--stable);
      text-align: center;
      letter-spacing: -0.02em;
      text-shadow: 0 0 30px rgba(46,213,115,0.3);
      display: none;
    }
    .hospital-name {
      font-size: 0.68rem;
      color: var(--text-secondary);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      text-align: center;
      display: none;
    }

    /* ── Mini Map ── */
    .map-card {
      border-radius: var(--radius-lg);
      overflow: hidden;
      border: 1px solid var(--glass-border);
      box-shadow: var(--shadow-md);
    }
    #mini-map {
      width: 100%;
      height: 200px;
    }
    .map-label {
      background: var(--bg-card-solid);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .map-label-text {
      font-family: var(--font-mono);
      font-size: 0.6rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .map-live-dot {
      width: 6px; height: 6px;
      background: var(--stable);
      border-radius: 50%;
      animation: blink 1.2s ease-in-out infinite;
    }

    /* ── Safety Protocol Card ── */
    .safety-card {
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-lg);
      padding: 20px;
    }
    .safety-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .safety-icon { font-size: 1.4rem; }
    .safety-title {
      font-family: var(--font-head);
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    .safety-title.disaster-color {
      background: linear-gradient(135deg, #638cff, #4f46e5);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .safety-title.emergency-color {
      background: linear-gradient(135deg, #ff4757, #ec4899);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }

    .safety-list { display: flex; flex-direction: column; gap: 14px; }
    .safety-step { display: flex; gap: 12px; animation: fade-up 0.4s var(--ease-out) both; }
    .safety-step:nth-child(2) { animation-delay: 0.1s; }
    .safety-step:nth-child(3) { animation-delay: 0.2s; }
    .step-num {
      width: 28px; height: 28px;
      flex-shrink: 0;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-head);
      font-size: 0.72rem;
      font-weight: 700;
    }
    .step-num.disaster-step  { background: rgba(99,140,255,0.12); color: #93b4ff; }
    .step-num.emergency-step { background: rgba(255,71,87,0.12); color: #ffa0a8; }

    .step-content h3 {
      font-family: var(--font-head);
      font-size: 0.82rem;
      font-weight: 700;
      color: white;
      margin-bottom: 3px;
    }
    .step-content p {
      font-size: 0.72rem;
      color: var(--text-secondary);
      line-height: 1.5;
    }

    /* ── SOS Type Badge ── */
    .sos-type-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 14px;
      border-radius: var(--radius-pill);
      font-family: var(--font-mono);
      font-size: 0.6rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .sos-type-badge.disaster {
      background: rgba(99,140,255,0.10);
      border: 1px solid rgba(99,140,255,0.2);
      color: #93b4ff;
    }
    .sos-type-badge.emergency {
      background: rgba(255,71,87,0.10);
      border: 1px solid rgba(255,71,87,0.2);
      color: #ffa0a8;
    }

    /* ── Footer ── */
    .confirm-footer {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 16px 0;
      border-top: 1px solid rgba(255,255,255,0.04);
      margin-top: 10px;
    }
    .footer-item {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 0.58rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-secondary);
    }
    .footer-dot { width: 5px; height: 5px; border-radius: 50%; }
    .footer-dot.green { background: var(--stable); }
    .footer-dot.cyan  { background: var(--accent); }
  </style>
  <link rel="manifest" href="/manifest.json">
</head>
<body class="scanline-overlay">

  <div class="mesh-bg"></div>
  <div class="noise-overlay"></div>
  <div class="hud-corner hud-tl"></div>
  <div class="hud-corner hud-tr"></div>
  <div class="hud-corner hud-bl"></div>
  <div class="hud-corner hud-br"></div>

  <nav class="nav-bar">
    <div class="nav-logo"><em>ON</em>CLICK <span class="nav-slash">/ CONFIRM</span></div>
    <div class="nav-spacer"></div>
    <div class="nav-badge">
      <span class="nav-dot"></span>
      SOS Transmitted
    </div>
  </nav>

  <div class="confirm-wrap">

    <!-- Status -->
    <div class="status-section" id="status-section">
      <div class="status-icon-wrap" id="status-icon-wrap">
        <div class="status-circle waiting" id="status-circle">
          <svg class="icon-svg icon-svg-xl" viewBox="0 0 24 24"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg>
        </div>
        <div class="ring-1"></div>
        <div class="ring-2"></div>
      </div>
      <div id="sos-badge-slot"></div>
      <h1 class="status-title" id="status-title">Connecting...</h1>
      <p class="status-subtitle" id="status-subtitle">Secure Link Established · Awaiting Dispatch</p>
      <div class="eta-display" id="eta-display"></div>
      <div class="hospital-name" id="hospital-name"></div>
    </div>

    <!-- Mini Map -->
    <div class="map-card">
      <div id="mini-map"></div>
      <div class="map-label">
        <div class="map-label-text">
          <span class="map-live-dot"></span>
          <span id="map-status-text">Your Location — Live</span>
        </div>
        <div id="badge-subtype" class="sos-type-badge" style="display:none;"></div>
      </div>
    </div>

    <!-- Safety Protocol -->
    <div class="safety-card" id="safety-card">
      <div class="safety-header">
        <span class="safety-icon" id="safety-icon"><svg class="icon-svg" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"/></svg></span>
        <span class="safety-title" id="safety-title">Safety Protocol</span>
      </div>
      <div class="safety-list" id="safety-list"></div>
    </div>

    <!-- Footer -->
    <footer class="confirm-footer">
      <div class="footer-item"><span class="footer-dot green"></span>SOS Active</div>
      <div class="footer-item"><span class="footer-dot cyan"></span>GPS Locked</div>
    </footer>

  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();

    const params = new URLSearchParams(window.location.search);
    const sosType = (params.get('type') || 'emergency').toUpperCase();
    const sosSubtype = (params.get('subtype') || 'unknown').toUpperCase();
    const isDisaster = sosType === 'DISASTER';

    // ── Safety Tips Database
    const safetyTips = {
      FLOOD: { icon:'🌊', title:'Flood Safety Protocol', steps:[
        { title:'Move to higher ground', desc:'Get to the highest floor immediately. Avoid basements and ground level.' },
        { title:'Avoid walking in water', desc:'Even 15cm of moving water can knock you down. 60cm can sweep a vehicle.' },
        { title:'Signal your location', desc:'If trapped, wave a bright cloth from a window or rooftop to signal rescuers.' }
      ]},
      EARTHQUAKE: { icon:'🌍', title:'Earthquake Safety Protocol', steps:[
        { title:'Drop, Cover, Hold On', desc:'Get under a sturdy table or desk. Protect your head and neck.' },
        { title:'Stay away from windows', desc:'Move away from glass, heavy furniture, and exterior walls.' },
        { title:'If trapped, tap on pipes', desc:'Use rhythmic tapping on pipes or walls to signal rescuers. Avoid shouting — save energy.' }
      ]},
      FIRE: { icon:'🔥', title:'Fire Safety Protocol', steps:[
        { title:'Stay low to the ground', desc:'Smoke rises — crawl to the nearest exit. Cover mouth with a wet cloth.' },
        { title:'Do NOT use elevators', desc:'Use stairs only. Check doors with back of your hand before opening.' },
        { title:'If clothes catch fire', desc:'Stop, Drop, and Roll. Cover your face with your hands.' }
      ]},
      COLLAPSE: { icon:'🏚️', title:'Structural Collapse Protocol', steps:[
        { title:'Find a survival gap', desc:'Get next to a large solid object — it may create a survival gap if the ceiling collapses.' },
        { title:'Cover your mouth', desc:'Dust and debris can cause suffocation. Use cloth to filter your breathing.' },
        { title:'Signal regularly', desc:'Tap on pipes, walls, or use your phone flashlight at regular intervals.' }
      ]},
      STORM: { icon:'⛈️', title:'Severe Storm Protocol', steps:[
        { title:'Move to an interior room', desc:'Stay away from windows, doors, and exterior walls. Basement is safest.' },
        { title:'Avoid electrical equipment', desc:'Unplug appliances. Avoid using landline phones during lightning.' },
        { title:'Do NOT go outside', desc:'Wait for the all-clear signal. Flying debris is the biggest danger.' }
      ]},
      GAS: { icon:'☠️', title:'Gas / Chemical Safety Protocol', steps:[
        { title:'Evacuate immediately', desc:'Leave the area upwind. Do NOT use ignition sources — no lighters, switches, phones.' },
        { title:'Cover nose and mouth', desc:'Use a wet cloth if available. Breathe through your mouth in short, shallow breaths.' },
        { title:'Do NOT re-enter', desc:'Wait for HAZMAT team clearance before going back inside.' }
      ]},
      MEDICAL: { icon:'🫀', title:'Medical Emergency Protocol', steps:[
        { title:'Keep patient still', desc:'Do not move the patient unless they are in immediate danger.' },
        { title:'Loosen tight clothing', desc:'Unbutton collars, loosen belts. Ensure clear airway.' },
        { title:'Monitor breathing', desc:'If breathing stops, begin CPR: 30 chest compressions, then 2 rescue breaths.' }
      ]},
      ACCIDENT: { icon:'🚗', title:'Road Accident Protocol', steps:[
        { title:'Do NOT move the injured', desc:'Moving someone with a spinal injury can cause permanent paralysis.' },
        { title:'Turn off vehicle ignition', desc:'Prevent fire risk. Turn on hazard lights for visibility.' },
        { title:'Control any bleeding', desc:'Apply firm pressure with a clean cloth. Elevate the injured limb if possible.' }
      ]},
      INJURY: { icon:'🩸', title:'Injury / Bleeding Protocol', steps:[
        { title:'Apply direct pressure', desc:'Use a clean cloth and press firmly on the wound. Do not remove blood-soaked cloths.' },
        { title:'Elevate the wound', desc:'If possible, raise the injured area above the level of the heart.' },
        { title:'Apply tourniquet if severe', desc:'For life-threatening limb bleeding, tie a tourniquet 5-7cm above the wound.' }
      ]},
      TRAPPED: { icon:'🚧', title:'Trapped Person Protocol', steps:[
        { title:'Conserve energy', desc:'Do not try to force your way out. Save energy and wait for rescuers.' },
        { title:'Make noise regularly', desc:'Tap on walls or pipes every few minutes. Use your phone flashlight.' },
        { title:'Protect your airways', desc:'Cover your nose and mouth with cloth to filter dust and debris.' }
      ]},
      UNCONSCIOUS: { icon:'🧠', title:'Unconscious Patient Protocol', steps:[
        { title:'Check for breathing', desc:'Tilt head back, lift chin. Look for chest movement, listen for breath sounds.' },
        { title:'Recovery position', desc:'If breathing, roll them onto their side. This prevents choking on vomit.' },
        { title:'Begin CPR if needed', desc:'No pulse or breathing? 30 chest compressions + 2 rescue breaths. Repeat.' }
      ]},
      PREGNANCY: { icon:'🤰', title:'Pregnancy Emergency Protocol', steps:[
        { title:'Keep mother calm', desc:'Help her lie on her left side. This improves blood flow to the baby.' },
        { title:'Time contractions', desc:'Note frequency and duration. If under 5 min apart, delivery may be imminent.' },
        { title:'Do NOT cut umbilical cord', desc:'If baby is delivered, keep mother and baby warm. Wait for paramedics.' }
      ]}
    };

    const defaultTips = {
      icon:'🛡️', title:'General Safety Protocol', steps:[
        { title:'Clear the pathway', desc:'Ensure all doors are unlocked and pathways are clear for paramedics.' },
        { title:'Gather medical info', desc:'Keep medications and medical records visible and ready to hand over.' },
        { title:'Stay calm and visible', desc:'If safe, go to the nearest entrance to guide emergency responders.' }
      ]
    };

    // ── Render page
    const tips = safetyTips[sosSubtype] || defaultTips;
    const colorClass = isDisaster ? 'disaster' : 'emergency';
    const stepClass = isDisaster ? 'disaster-step' : 'emergency-step';
    const titleClass = isDisaster ? 'disaster-color' : 'emergency-color';

    document.getElementById('sos-badge-slot').innerHTML = `<div class="sos-type-badge ${colorClass}">
      ${isDisaster ? '▲' : '●'} ${sosType} — ${sosSubtype}
    </div>`;

    const subtypeBadge = document.getElementById('badge-subtype');
    subtypeBadge.style.display = 'inline-flex';
    subtypeBadge.className = `sos-type-badge ${colorClass}`;
    subtypeBadge.textContent = sosSubtype;

    document.getElementById('safety-icon').textContent = tips.icon;
    const safetyTitle = document.getElementById('safety-title');
    safetyTitle.textContent = tips.title;
    safetyTitle.classList.add(titleClass);

    const safetyList = document.getElementById('safety-list');
    safetyList.innerHTML = tips.steps.map((step, i) => `
      <div class="safety-step">
        <div class="step-num ${stepClass}">${i + 1}</div>
        <div class="step-content">
          <h3>${step.title}</h3>
          <p>${step.desc}</p>
        </div>
      </div>
    `).join('');

    // ── Mini Map
    const storedLat = parseFloat(sessionStorage.getItem('onclick_lat')) || 18.5204;
    const storedLon = parseFloat(sessionStorage.getItem('onclick_lon')) || 73.8567;

    const miniMap = L.map('mini-map', { zoomControl: false, attributionControl: false })
      .setView([storedLat, storedLon], 15);

    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      subdomains: 'abcd', maxZoom: 20
    }).addTo(miniMap);

    const userColor = isDisaster ? '#638cff' : '#ff4757';
    const userMarker = L.circleMarker([storedLat, storedLon], {
      radius: 10, color: userColor, fillColor: userColor, fillOpacity: 0.5, weight: 2
    }).addTo(miniMap).bindPopup(`<b>Your Location</b><br/>${sosType} — ${sosSubtype}`);

    let ambMarker = null;

    // ── Socket
    socket.on('pre_alert_generated', (data) => {
      if (data.autoReserved) {
        document.getElementById('status-title').innerHTML = 'AI Triage: <span style="color:#ff4757">CRITICAL</span>';
        document.getElementById('status-subtitle').textContent = 'Nearest hospital auto-reserved. Waiting for unit dispatch.';
        
        const hospEl = document.getElementById('hospital-name');
        hospEl.innerHTML = `<span style="color:#ff4757;font-size:0.7em;">⚠️ AUTO-RESERVED</span><br/>${data.autoReserved.hospital.name}`;
        hospEl.style.display = 'block';

        const etaEl = document.getElementById('eta-display');
        etaEl.textContent = `ETA: ${data.autoReserved.eta}`;
        etaEl.style.display = 'block';
      }
    });
    socket.on('help_is_coming', (data) => {
      const circle = document.getElementById('status-circle');
      circle.innerHTML = '<svg class="icon-svg icon-svg-xl" style="color:var(--stable)" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>';
      circle.classList.remove('waiting');
      circle.classList.add('confirmed');
      document.getElementById('status-title').textContent = 'Help is on the way.';
      document.getElementById('status-subtitle').textContent = 'Rescue Unit Dispatched';
      if (data && data.eta) {
        const etaEl = document.getElementById('eta-display');
        etaEl.textContent = `ETA: ${data.eta}`;
        etaEl.style.display = 'block';
      }
      if (data && data.hospital) {
        const hospEl = document.getElementById('hospital-name');
        hospEl.textContent = `Destination: ${data.hospital}`;
        hospEl.style.display = 'block';
      }
      document.getElementById('map-status-text').textContent = 'Ambulance Tracking — Live';
    });

    socket.on('ambulance_position', (data) => {
      if (!data.lat || !data.lon) return;
      if (ambMarker) {
        ambMarker.setLatLng([data.lat, data.lon]);
      } else {
        const ambIcon = L.divIcon({
          className: '',
          html: '<div style="font-size:1.3rem;filter:drop-shadow(0 2px 6px rgba(99,140,255,0.5));animation:float 1s ease-in-out infinite alternate;">🚑</div>',
          iconSize: [24, 24], iconAnchor: [12, 12]
        });
        ambMarker = L.marker([data.lat, data.lon], { icon: ambIcon }).addTo(miniMap);
      }
      if (data.arrived) {
        document.getElementById('map-status-text').textContent = '🏁 Ambulance Arrived';
      }
    });
  </script>
  <script>
    if("serviceWorker" in navigator){
      window.addEventListener("load",()=>{
        navigator.serviceWorker.register("/sw.js").catch(e=>console.error("SW Error",e));
      });
    }
  </script>
</body>
</html>
